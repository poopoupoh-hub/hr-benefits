# PostgreSQL สำหรับพัฒนา (ไม่บังคับ) — ใช้คู่กับ docs/GETTING-STARTED.md ข้อ 10
# เริ่ม:  docker compose -f docker-compose.postgres.yml up -d
# DATABASE_URL="postgresql://postgres:postgres@localhost:5432/hr_benefits"
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_benefits
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
